<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MindArcade — Sudoku, caça-palavras, nonogramas e enigmas grátis. Desafios diários para quem gosta de pensar." />
    <meta name="theme-color" content="#6c4cf1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem("mindarcade:settings") || "{}").theme;
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <title>MindArcade — Jogos, passatempos e desafios mentais</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
